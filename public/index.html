<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="CEI - Controle Escolar Inteligente - Gerenciamento de Biblioteca - Sistema de Gestão de Biblioteca e Patrimônio" />
    
    <!-- Prevenir Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CEI" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      (function (location) {
        if (location.search.length > 1 && location.search[1] === '/') {
          const decoded = location.search
            .slice(1)
            .split('&')
            .map((segment) => segment.replace(/~and~/g, '&'))
            .join('?');

          window.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })(window.location);
    </script>
    
    <title>CEI - Controle Escolar Inteligente - Gerenciamento de Biblioteca</title>
    
    <!-- 🔐 PROTEÇÃO DE CONSOLE - CARREGAR PRIMEIRO -->
    <script src="%PUBLIC_URL%/supabase-runtime-config.js?v=20260511"></script>
    <script src="%PUBLIC_URL%/consoleProtection.js"></script>
    
    <!-- Forçar atualização - versão com ISBN obrigatório -->
    <script>
      // Versão do sistema
      window.CEI_VERSION = '3.7.1';
      window.CEI_BUILD = Date.now();
      
      console.log('🚀 CEI v3.7.1 - Bloco único Série/Turma + correções de atualização');
      
      // Limpar cache ao carregar
      if ('caches' in window) {
        caches.keys().then(keys => {
          keys.forEach(key => {
            caches.delete(key);
            console.log('🗑️ Cache removido:', key);
          });
        });
      }
      
      // Desregistrar TODOS os service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => {
            reg.unregister();
            console.log('🗑️ Service Worker desregistrado');
          });
        });
      }
      
      // Limpar localStorage de versão e forçar atualização
      const savedVersion = localStorage.getItem('cei_app_version');
      if (savedVersion !== '3.7.1') {
        console.log('🔄 Atualizando de', savedVersion, 'para 3.7.1');
        localStorage.setItem('cei_app_version', '3.7.1');
        localStorage.setItem('cei_force_reload', 'true');
      }
      
      // Forçar reload completo na primeira carga da nova versão
      window.addEventListener('load', () => {
        const forceReload = localStorage.getItem('cei_force_reload');
        if (forceReload === 'true') {
          localStorage.removeItem('cei_force_reload');
          console.log('🔄 Forçando reload completo com hard refresh...');
          setTimeout(() => {
            location.replace(location.href.split('?')[0] + '?v=3.7.1&t=' + Date.now());
          }, 1000);
        }
      });
    </script>
    
    <!-- Mercado Pago SDK para tokenização de cartões -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para usar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
